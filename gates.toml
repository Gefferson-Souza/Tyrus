# Fonte única de limiares e do estado de cada gate (unidade gov-gates-toml).
# Leitura: scripts/gates/cfg.py (get | validate | parity | deny-config). Consumo: scripts/gates.sh.
# Raiz de confiança: alteração aqui exige revisão do dono.

[meta]
schema_version = 1
semantics_source = "docs/standards/CONSTITUTION.md"

# Crates legados (regime do Power of Ten). A lista só encolhe.
[legacy]
crates = [
    "tyrus_analyzer",
    "tyrus_ast",
    "tyrus_cli",
    "tyrus_codegen",
    "tyrus_common",
    "tyrus_decorator_kinds",
    "tyrus_di",
    "tyrus_diagnostics",
    "tyrus_orchestrator",
    "tyrus_parser",
    "tyrus_test_utils",
    "integration_tests",
]

# Allowlist fechada de unsafe (ADR 0016). Acrescentar crate exige ADR.
[unsafe_allowlist]
crates = ["tyrus_host", "tyrus_platform", "tyrus_heap"]

# Módulos (caminho relativo a src/) que podem carregar #[allow(unsafe_code)].
[unsafe_allowlist.modules]
tyrus_host = []
tyrus_platform = []
tyrus_heap = []

[thresholds]
file_soft_cap = 400
file_hard_cap = 800
# Violadores antigos do teto suave (issue #153); nunca passam do teto duro.
filesize_soft_allowlist = ['/convert/class/constructor\.rs$', '/convert/interface\.rs$']
fn_max_lines = 50
fn_max_params = 5
nesting_max = 4
coverage_min = 73
disk_min_gb_all = 15
disk_min_gb_step = 3
# PROVISORIO (ADR 0018 Proposto): imutavel depois da primeira medicao do hospedado.
g1_margin = 1.05
g1b_upper = 1.0
g2_promote_max = 0.9
g2_demote_min = 1.0
g2_demote_nights = 2
# Piso 1.0 ate o dono fixar os numeros definitivos (Q-D).
m2_rss_ratio_max = 1.0
m2_startup_ratio_max = 1.0
ci_level = 0.95
g1_min_rounds = 15

# Quem pode depender de cada crate guardado. Crates legados so aceitam legados
# como dependentes (gerado de [legacy]); os demais sao a direcao
# facts -> place -> assemble, e o runtime nunca depende do compilador.
[direction.allowed_dependents]
tyrus_facts = ["tyrus_place", "tyrus_assemble", "tyrus_cli"]
tyrus_place = ["tyrus_assemble", "tyrus_cli"]
tyrus_assemble = ["tyrus_cli"]
# Runtime: nao depende do compilador (teste no_compiler_deps); quem le/escreve o arquivo do fecho.
tyrus_archive = ["tyrus_assemble", "tyrus_cli", "tyrus_host"]

[claims]
paths = ["docs", "README.md", "ROADMAP.md"]

# state = ACTIVE | SKIPPED. SKIPPED exige activates_in (fase) e imprime SKIPPED(<fase>).
# ci_exempt = motivo de nao ter passo proprio no CI.

[gates.fmt]
state = "ACTIVE"

[gates.clippy]
state = "ACTIVE"

[gates.filesize]
state = "ACTIVE"

[gates.unsafe]
state = "ACTIVE"

[gates.direction]
state = "ACTIVE"

[gates.gates-toml]
state = "ACTIVE"

[gates.gates-selftest]
state = "ACTIVE"

[gates.audit-policy]
state = "ACTIVE"

[gates.replica]
state = "ACTIVE"

[gates.wire]
state = "ACTIVE"

[gates.front]
state = "ACTIVE"

[gates.test]
state = "ACTIVE"

[gates.coverage]
state = "ACTIVE"

[gates.deny]
state = "ACTIVE"

[gates.audit]
state = "ACTIVE"

[gates.machete]
state = "ACTIVE"

[gates.node-pins]
state = "ACTIVE"
ci_exempt = "chamado por test e coverage, que sao passos de CI"

[gates.corpus-immutable]
state = "ACTIVE"

[gates.claims]
state = "SKIPPED"
activates_in = "docs-claims-migration"

[gates.rules-lint]
state = "ACTIVE"

# Regra da Constituição -> mecanismo. 'gates' lista gates existentes em [gates.*];
# 'planned_in' nomeia a unidade que entrega o mecanismo ainda inexistente (imprime SKIPPED, nunca PASS).
[constitution_rules]
R1 = { planned_in = "place-all-hosted" }
R2 = { planned_in = "m2-rename-metamorphic-gate" }
R3 = { planned_in = "m2-l1-differential-vectors" }
R4 = { planned_in = "m2-analyze-guard-proof" }
R5 = { planned_in = "bench-g1-parity-harness" }
R6 = { planned_in = "asm-project-emitter" }
R7 = { planned_in = "asm-determinism-verify" }
R8 = { gates = ["claims"] }
R9 = { planned_in = "orc-self-examination" }
R10 = { gates = ["unsafe"] }
R11 = { gates = ["rules-lint", "gates-toml"] }
R12 = { gates = ["rules-lint"] }

[rules_lint]
constitution = "docs/standards/CONSTITUTION.md"
adr_dir = "docs/architecture/decisions"
adr_index = "docs/ARCHITECTURE.md"
naming_paths = ["docs", "CLAUDE.md", ".claude/rules"]
# Nomes de padrão (não de iteração do compilador) e versões de esquema de ferramenta.
naming_allow = ["Power of Ten v2", "schema v2"]

# PROVISORIO: as categorias são decisão do dono (RFC, risco 6, conta todo o oracle/).
# Aqui 'tooling' é o ferramental de governança e medição; 'oracle' (crate, baterias, corpus,
# réplica) é reportado na razão larga, sem teto.
[loc_budget]
tooling_max_ratio = 0.25
exclude = ["vendor/"]
extensions = [".rs", ".py", ".sh", ".ts", ".js", ".mjs", ".yml", ".yaml"]

[loc_budget.categories]
tooling = ["scripts/", ".github/", ".claude/hooks/", ".claude/workflows/", "oracle/harness/", "benchmarks/"]
oracle = ["crates/tyrus_oracle/", "oracle/"]
