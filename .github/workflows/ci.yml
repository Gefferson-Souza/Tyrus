name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Fast checks — run in parallel, fail fast.
  # All gate commands live in scripts/gates.sh — the single source of truth
  # shared with the local pre-commit hook. See docs/standards/POWER_OF_TEN.md
  # Rule 9 (Local-First Validation Parity) and ADR 0008.

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: ./scripts/gates.sh fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/gates.sh clippy
      # Rule 4 file ceiling — same gate the pre-commit hook runs (Rule 9:
      # every gates.sh gate has a 1:1 CI step; this one was hook-only, #213).
      - run: ./scripts/gates.sh filesize
      # Rule 13 (amended by ADR 0016): crate roots declare their unsafe_code level (#214).
      - run: ./scripts/gates.sh unsafe
      # gates.toml is the single source of thresholds and gate state; it must stay
      # valid and in parity with gates.sh and this workflow.
      - run: ./scripts/gates.sh gates-toml
      # Prints SKIPPED(<phase>) until the docs migration activates it; never a silent pass.
      - run: ./scripts/gates.sh claims

  # Replica gate (oracle/apps/replica): parity with Gate 0, request set, tooling tests.
  # The Docker end-to-end run is the replica-e2e job below (change detection inside the job).
  replica-static:
    name: Replica (static gate)
    runs-on: ubuntu-latest
    env:
      TYRUS_REQUIRE_SHELLCHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/gates.sh replica
      - run: ./scripts/gates.sh wire

  replica-e2e:
    name: Replica (end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect replica changes
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qE '^(oracle/apps/replica/|oracle/harness/|oracle/oracle\.lock|scripts/check_replica_parity\.sh|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read the reference Node from oracle.lock
        if: steps.changes.outputs.run == 'true'
        id: lock
        run: echo "node=$(python3 -I -c 'import json; print(json.load(open("oracle/oracle.lock"))["reference"]["node"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: ${{ steps.lock.outputs.node }}
      - if: steps.changes.outputs.run == 'true'
        run: oracle/apps/replica/tools/verify_replica.sh
      - if: steps.changes.outputs.run == 'true'
        run: oracle/harness/tools/verify_wire.sh

  # MSRV — the workspace must keep compiling on the declared minimum
  # supported Rust version ([workspace.package] rust-version).
  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --locked

  # Unused dependencies — Rule 12. Textual scan, no compilation.
  machete:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-machete
      - run: ./scripts/gates.sh machete

  # Supply-chain & security checks — run in parallel with build, share cache.
  # `cargo deny` enforces deny.toml; `cargo audit` cross-checks against the
  # RustSec advisory DB on every push/PR rather than relying on a periodic run.
  security:
    name: Security & Supply-Chain
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-deny,cargo-audit
      - run: ./scripts/gates.sh deny
      - run: ./scripts/gates.sh audit
      # Dependency direction (front -> facts -> place -> assemble; legacy stays closed),
      # generated from gates.toml and enforced by cargo-deny bans.wrappers.
      - run: ./scripts/gates.sh direction
      # Tests of gates.toml, cfg.py and the gates themselves (fixtures; needs cargo-deny and clippy).
      - run: ./scripts/gates.sh gates-selftest

  # Build + test in single job (shares compilation cache within job)
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Setup Node.js 22.21.1 (oracle seed tuple)
        uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'
      - name: Pin the seed Node binary
        run: echo "TYRUS_NODE_SEED=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup Node.js 26.11.1 (oracle reference tuple)
        uses: actions/setup-node@v7
        with:
          node-version: '26.11.1'
      - name: Pin the reference Node binary
        run: echo "TYRUS_NODE_REFERENCE=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup Node.js 22 (for semantic equivalence tests)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test (gates.sh)
        run: ./scripts/gates.sh test

      - name: Verify Real-World Demo
        run: |
          ./target/debug/tyrus build examples/real_world_demo/src --output examples/real_world_demo/output
          cd examples/real_world_demo/output && cargo check

  # Coverage — Rule 5 (POWER_OF_TEN.md) enforcement via cargo-llvm-cov.
  # Runs in parallel with `bench` after `build` succeeds. Workspace line
  # coverage must stay at or above the threshold configured in
  # `scripts/gates.sh::gate_coverage` (default 73%, override via
  # TYRUS_COVERAGE_MIN). Ramp-up to 80% tracked in issue #163. The
  # coverage gate ignores test/bench infra (`tyrus_test_utils`,
  # `*/benches/`) so the denominator only counts product code.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # Namespace the rust-cache key so coverage-instrumented artifacts
      # don't share storage with the regular `build`/`test` jobs.
      # Mixing instrumented and non-instrumented `target/` confuses
      # incremental builds and silently invalidates the cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
          cache-directories: target/llvm-cov-target

      - name: Setup Node.js 22.21.1 (oracle seed tuple)
        uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'
      - name: Pin the seed Node binary
        run: echo "TYRUS_NODE_SEED=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup Node.js 26.11.1 (oracle reference tuple)
        uses: actions/setup-node@v7
        with:
          node-version: '26.11.1'
      - name: Pin the reference Node binary
        run: echo "TYRUS_NODE_REFERENCE=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup Node.js 22 (for semantic equivalence tests)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install cargo-llvm-cov and nextest
        uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Run coverage gate (gates.sh)
        run: ./scripts/gates.sh coverage
        env:
          # Threshold pinned to the 2026-05-03 baseline floor.
          # Ramp-up to 80 is tracked in issue #163 alongside the
          # Sprint 3 equivalence-test work (#154); raise this number
          # in the PR that closes the gap.
          TYRUS_COVERAGE_MIN: '73'

  # Benchmarks — run after tests pass, upload criterion HTML reports
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Setup Node.js 22 (for runtime comparison)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run transpilation benchmarks
        run: cargo bench --bench transpiler

      - name: Run runtime comparison
        run: BENCH_ITERATIONS=3 cargo bench --bench runtime_comparison
        env:
          BENCH_CSV: 1

      - name: Upload criterion reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-reports
          path: target/criterion/
          retention-days: 30

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
