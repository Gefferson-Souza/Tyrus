[package]
name = "tyrus_archive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Arquivo do fecho do Tyrus: escritor e leitor determinísticos (zstd por entrada, sha256 por entrada e do conjunto)."
publish = false

[lib]
name = "tyrus_archive"
path = "src/lib.rs"

[[bin]]
name = "tyrus-archive"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
jsonschema = { version = "0.59.0", default-features = false }

[lints]
workspace = true
