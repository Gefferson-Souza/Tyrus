[package]
name = "tyrus_oracle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Oráculo do Tyrus: tupla de referência pinada (oracle.lock) e álgebra de vereditos fechada."
publish = false

[lib]
name = "tyrus_oracle"
path = "src/lib.rs"

[[bin]]
name = "tyrus-oracle"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
jsonschema = { version = "0.59.0", default-features = false }

[lints]
workspace = true
