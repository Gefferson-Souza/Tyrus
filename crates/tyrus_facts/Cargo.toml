[package]
name = "tyrus_facts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Fatos do front-end (ST1): tipos de facts.json, closure.lock e partition.lock, JSON canônico e validação de versão e hash."
publish = false

[lib]
name = "tyrus_facts"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
# preserve_order ligado nos testes: sem ele o Map já é ordenado e a ordenação própria seria invisível.
serde_json = { version = "1.0", features = ["preserve_order"] }
jsonschema = { version = "0.59.0", default-features = false }

[lints]
workspace = true
