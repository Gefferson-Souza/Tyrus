# cargo-deny configuration — schema v2 (cargo-deny ≥0.16).
# Run: cargo deny check
#
# Layout:
#   [advisories] — RustSec DB (vulnerabilities, yanked, unmaintained)
#   [licenses]   — SPDX allowlist + confidence threshold
#   [bans]       — duplicate versions, wildcards, explicit denylist
#   [sources]    — registry/git allowlist
#
# v2 changes vs v1: `vulnerability`, `unsound`, `notice` keys are gone
# (advisories are deny-by-default). `unmaintained` is now a
# graph-scope enum, not a severity. `unlicensed` is gone (covered by
# `confidence-threshold` and `allow`).

[advisories]
version = 2
# Separate path from `cargo audit` (which uses `~/.cargo/advisory-db` by
# default). Both tools clone the same RustSec DB but expect different
# layouts; sharing a single path breaks whichever runs second.
db-path = "~/.cargo/cargo-deny-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# `unmaintained` is now scoped: "all" | "workspace" | "transitive" | "none".
# "workspace" only flags unmaintained crates we depend on directly.
unmaintained = "workspace"
# Espelho de audit.toml (fonte única das exceções, com reach/owner/expires);
# scripts/gates/audit_policy.py reprova se as duas listas divergirem.
ignore = [
    # number_prefix unmaintained — transitive via indicatif (CLI progress bar).
    # Not a vulnerability. Resolves once indicatif drops the dependency.
    "RUSTSEC-2025-0119",
    # rand unsound only when paired with a custom rand_core::CryptoRng + a
    # specific logger pattern we never construct. Tracked for the next rand
    # upgrade (≥ 0.9) which fixes the soundness gap.
    "RUSTSEC-2026-0097",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
# Wildcards are warnings, not errors: every workspace crate uses path
# dependencies to its peers (e.g. `tyrus_common = { path = "..." }`), and
# cargo-deny classifies those as wildcards once a `repository` field makes
# the crate "public". `allow-wildcard-paths = true` does not apply because
# the explicit `repository` in `[workspace.package]` qualifies them as
# public. Real external wildcards (e.g. `serde = "*"`) would still surface
# in the warnings stream and can be promoted to "deny" once the workspace
# moves to [workspace.dependencies] inheritance for path deps.
wildcards = "warn"
allow-wildcard-paths = true
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
